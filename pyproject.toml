[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-smartlog"
version = "1.0.0"
description = "A sparse, local-first Git history viewer"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
git-smartlog = "smartlog.cli:main"

[tool.setuptools]
packages = ["smartlog"]
